name: biometric_signature_example
description: >-
  API Explorer for the biometric_signature plugin: every method, config
  field, format and error code, with a call log that copies each call as
  Dart and local (demo-only) signature, decryption and attestation checks.
publish_to: 'none'

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.5'

dependencies:
  flutter:
    sdk: flutter

  # The Explorer ships inside the plugin package, so it uses the plugin (and
  # the shared example helpers) by path. In your own app use:
  #   biometric_signature: ^13.2.0
  biometric_signature:
    path: ../
  examples_shared:
    path: packages/examples_shared

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
