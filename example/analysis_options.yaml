include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # The shared package is analyzed on its own (it has its own
    # analysis_options.yaml and tests).
    - packages/**
    - build/**

linter:
  rules:
    - prefer_single_quotes
    - prefer_final_locals
    - sort_child_properties_last
    - use_super_parameters
