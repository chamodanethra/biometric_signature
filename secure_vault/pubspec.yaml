name: secure_vault_example
description: "Secure Vault example: secrets sealed to a hardware-backed key, revealed only by biometric decryption"
publish_to: none

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.5'

dependencies:
  flutter:
    sdk: flutter
  biometric_signature:
    path: ../
  examples_shared:
    path: ../example/packages/examples_shared
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
