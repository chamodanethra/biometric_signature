name: passwordless_login_example
description: >-
  Attested device binding with biometric_signature: a per-account hardware
  key, Android key attestation verified by a mock server, and replay-resistant
  challenge-response sign-in. Demo code, not production code.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.5'

dependencies:
  flutter:
    sdk: flutter
  biometric_signature:
    path: ../
  examples_shared:
    path: ../example/packages/examples_shared

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
