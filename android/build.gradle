group = "com.visionflutter.biometric_signature"
version = "1.0-SNAPSHOT"

buildscript {
    // https://github.com/juliansteenbakker/mobile_scanner/issues/729#issuecomment-1758610026
    ext.kotlin_version = "2.4.10"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:9.6.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// AGP 9+ ships "built-in Kotlin" by default: it supplies the Kotlin toolchain and
// removes the `kotlinOptions {}` DSL, so applying `kotlin-android` ourselves fails.
// Only apply it (and use kotlinOptions) when built-in Kotlin is NOT active, keeping
// us compatible with AGP 8, AGP 9 default, and AGP 9 opt-out (android.builtInKotlin=false).
def isAgp9OrAbove = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0].toInteger() >= 9
def hasBuiltInKotlin = isAgp9OrAbove && project.findProperty('android.builtInKotlin')?.toString() != 'false'

apply plugin: "com.android.library"
if (!hasBuiltInKotlin) {
    apply plugin: "kotlin-android"
}

android {
    namespace = "com.visionflutter.biometric_signature"

    buildFeatures {
        buildConfig true
    }

    compileSdk = 37

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    // Under AGP 9 built-in Kotlin, the JVM target follows `compileOptions` (VERSION_11
    // above); `kotlinOptions` is only available when `kotlin-android` is applied.
    if (!hasBuiltInKotlin) {
        kotlinOptions {
            jvmTarget = JavaVersion.VERSION_11
        }
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 23
        consumerProguardFiles 'proguard-rules.pro'
    }

    lintOptions {
        disable "InvalidPackage"
    }

    dependencies {
        implementation("androidx.biometric:biometric:1.4.0-alpha05")
        implementation("androidx.appcompat:appcompat:1.6.1")
        implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2")
    }
}
