name: banking_app_example
description: >-
  Step-up transaction signing with biometric_signature: a silent
  device-binding key signs every API request, a biometric approval key signs
  the exact bytes of larger transfers, and an in-process mock bank verifies
  both (including Android key attestation). Demo code, not production code.
publish_to: none

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.5'

dependencies:
  flutter:
    sdk: flutter
  biometric_signature:
    path: ../
  examples_shared:
    path: ../example/packages/examples_shared
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
